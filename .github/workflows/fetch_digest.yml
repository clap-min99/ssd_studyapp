name: Fetch Daily Digest

on:
  schedule:
    - cron: "*/15 20-21 * * *"   # KST 05:00~06:45, 15분마다 시도
  workflow_dispatch:
    inputs:
      date:
        description: "수집할 날짜 (YYYY-MM-DD, 비우면 최신 메일)"
        required: false
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: Gmail 인증 정보 복원
        run: |
          echo "$GMAIL_CREDENTIALS_JSON" > fetcher/credentials.json
          echo "$GMAIL_TOKEN_JSON" > fetcher/token.json
        env:
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}

      - name: DB 마이그레이션 (혹시 새 마이그레이션 있으면 적용)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        run: python manage.py migrate

      - name: 다이제스트 수집 + 저장
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DIGEST_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$DIGEST_DATE" ]; then
            python manage.py fetch_digest --date "$DIGEST_DATE"
          else
            python manage.py fetch_digest
          fi
